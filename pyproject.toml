[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pq-escrow"
version = "2.0.0"
requires-python = ">=3.13"
dependencies = ["dilithium-py==1.5.1", "Flask==3.1.3", "psycopg[binary]==3.3.6", "cryptography==48.0.1"]

[tool.setuptools.packages.find]
include = ["escrow*", "webapp*"]

[tool.setuptools.package-data]
webapp = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.vercel]
entrypoint = "app:app"
